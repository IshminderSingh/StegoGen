[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stegogen"
version = "0.1.0"
description = "Secure Image Steganography Generator"
readme = "README.md"
authors = [{ name = "StegoGen Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
stegogen = "stegogen.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]